
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Ek Hindu — Something Traditional is coming soon. Stay tuned.">

  <meta name="theme-color" content="#F8DDAA">

  <title>Coming Soon | Ek Hindu</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <style>
    :root {
      --background: #F8DDAA;
      --card: #FBE8C5;
      --copper: #A64D22;
      --copper-dark: #71351D;
      --saffron: #D99A37;
      --text: #34271F;
      --muted: #70513B;
      --border: #D4A66C;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Inter', Arial, sans-serif;
      color: var(--text);
      background: var(--background);
    }

    .card {
      width: 100%;
      max-width: 760px;
      padding: 48px 28px 36px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 18px 55px rgba(113, 53, 29, 0.10);
    }

    .logo {
      display: block;
      width: 180px;
      max-width: 70%;
      height: auto;
      margin: 0 auto 30px;
    }

.label {
  display: inline-block;
  padding: 12px 24px;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--copper-dark);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 2px;
  line-height: 1.5;
  text-transform: uppercase;
}

    h1 {
      margin: 26px 0 18px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(48px, 8vw, 78px);
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -1px;
    }

    h1 span {
      color: var(--copper);
    }

    p {
      max-width: 490px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.9;
    }

    .contact {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 25px;
      border: 1px solid var(--copper);
      border-radius: 8px;
      color: #FFFFFF;
      background: var(--copper);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .contact:hover {
      background: var(--copper-dark);
    }

    .contact:focus-visible {
      outline: 3px solid var(--saffron);
      outline-offset: 4px;
    }

    footer {
      margin-top: 40px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 36px 20px 26px;
        border-radius: 18px;
      }

      .logo {
        width: 150px;
        margin-bottom: 26px;
      }

      h1 {
        letter-spacing: -0.5px;
      }

      p {
        font-size: 14px;
      }

      footer {
        margin-top: 32px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .contact {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <!-- Your logo: keep the image beside index.html -->
    <img
      class="logo"
      src="./fbe8c5_logo_small.jpeg"
      alt="Ek Hindu logo"
      width="738"
      height="735"
    >

    <div class="label">
      Something Traditional is Coming
    </div>

    <h1>
      Coming <span>Soon.</span>
    </h1>

    <p>
      We're working on something special.
      Our new website is under construction.
      Stay tuned for updates!
    </p>

    <!-- Replace this with your real email address -->
    <a class="contact" href="mailto:hello@example.com">
      Contact Us
    </a>

    <footer>
      &copy; 2026 Ek Hindu. All rights reserved.
    </footer>

  </main>
</body>
</html>
