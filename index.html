
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Something new is coming soon. Stay tuned!">
  <meta name="theme-color" content="#0b1020">
  <title>Coming Soon | Your Brand</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(ellipse at top, #25346a 0%, transparent 55%),
        linear-gradient(135deg, #0b1020, #111827);
    }

    .card {
      width: 100%;
      max-width: 720px;
      text-align: center;
      padding: 56px 28px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 24px;
      background: rgba(255,255,255,.05);
      box-shadow: 0 24px 80px rgba(0,0,0,.25);
    }

    .label {
      display: inline-block;
      padding: 9px 15px;
      border-radius: 999px;
      border: 1px solid #6476b8;
      color: #c7d2fe;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 28px 0 16px;
      font-size: clamp(42px, 8vw, 76px);
      line-height: 1.05;
      letter-spacing: -3px;
    }

    h1 span {
      color: #a5b4fc;
    }

    p {
      max-width: 510px;
      margin: 0 auto;
      color: #cbd5e1;
      font-size: 17px;
      line-height: 1.8;
    }

    .contact {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 22px;
      border-radius: 10px;
      color: #10172b;
      background: #c7d2fe;
      text-decoration: none;
      font-weight: bold;
    }

    .contact:hover {
      background: #ffffff;
    }

    footer {
      margin-top: 42px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="label">Something exciting is coming</div>

    <h1>Coming <span>Soon.</span></h1>

    <p>
      We're working on something special.
      Our new website is under construction.
      Stay tuned for updates!
    </p>

    <a class="contact"
       href="mailto:hello@example.com">
      Contact Us
    </a>

    <footer>
      &copy; 2026 Your Brand. All rights reserved.
    </footer>
  </main>
</body>
</html>
